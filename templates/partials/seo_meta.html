{% load static site_extras %}
<title>{% block seo_title %}{{ site_settings.default_seo_title|default:site_settings.site_name }}{% endblock %}</title>
<meta name="description" content="{% block seo_description %}{{ site_settings.default_meta_description|default:site_settings.tagline }}{% endblock %}">
{% block seo_robots %}<meta name="robots" content="index, follow">{% endblock %}
{% block seo_canonical %}{% endblock %}

<meta property="og:site_name" content="{{ site_settings.site_name }}">
<meta property="og:type" content="website">
<meta property="og:title" content="{% block og_title %}{{ site_settings.default_seo_title|default:site_settings.site_name }}{% endblock %}">
<meta property="og:description" content="{% block og_description %}{{ site_settings.default_meta_description|default:site_settings.tagline }}{% endblock %}">
{% block og_image %}{% if site_settings.default_og_image %}<meta property="og:image" content="{{ site_settings.default_og_image.url|absolute_url:request }}">{% endif %}{% endblock %}
<meta name="twitter:card" content="summary_large_image">
