{% load icons %}
<section class="trust-strip">
  <div class="marquee">
    <div class="marquee-track">
      {% for i in "12" %}
        {% for service in services %}
        <div class="trust-item">{% icon service.icon %}{{ service.name }}</div>
        {% endfor %}
        <div class="trust-item">{% icon 'heart' %}Community Impact</div>
        <div class="trust-item">{% icon 'handshake' %}Youth &amp; Women Empowerment</div>
      {% endfor %}
    </div>
  </div>
</section>
